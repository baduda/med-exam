<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testy — egzamin (chirurgia szczękowo-twarzowa)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Testy do egzaminu</h1>
    <div id="score"></div>
  </header>
  <main>
    <section id="start">
      <p class="lead">Pytania jednokrotnego wyboru (A–E) na podstawie podręcznika
        chirurgii szczękowo-twarzowej.</p>
      <label>Tryb:
        <select id="mode">
          <option value="order">Po kolei</option>
          <option value="random">Losowo</option>
        </select>
      </label>
      <div class="actions">
        <button id="start-btn">Start</button>
        <button id="reset-btn" type="button">Reset postępu</button>
      </div>
      <p id="loaded" class="muted"></p>
    </section>

    <section id="quiz" hidden>
      <div id="progress" class="muted"></div>
      <p id="question"></p>
      <ul id="options"></ul>
      <p id="explanation" hidden></p>
      <p id="source" class="muted" hidden></p>
      <button id="next-btn" hidden>Dalej</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
